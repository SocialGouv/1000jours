name: Expo Build Prod
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Plateforme à construire"
        type: choice
        default: all
        options:
          - all
          - ios
          - android

jobs:
  Build-ios:
    name: Build and publish iOS for Prod
    if: ${{ inputs.platform == 'all' || inputs.platform == 'ios' || inputs.platform == '' }}
    runs-on: ubuntu-latest
    env:
      API_URL: https://backoffice-les1000jours.fabrique.social.gouv.fr
      CLEAR_STORAGE: false
      MATOMO_APPLICATION_ID: 43
      MATOMO_ENABLED: true
      MATOMO_URL: https://matomo.fabrique.social.gouv.fr/
      SENTRY_DSN: https://5dbac413000f4a43a073841acebc82f5@sentry.fabrique.social.gouv.fr/55
      SENTRY_ENABLED: true
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      DEEPLINK_DOMAIN: 1000jours.fabrique.social.gouv.fr
      DEEPLINK_PATH: app-millejours
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # eas-cli >= 24 (et ses dépendances) exige Node 22
          node-version: 22.x

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # En mode non interactif, EAS a besoin d'une clé API App Store Connect
      # pour valider ou régénérer le certificat et le profil de provisionnement.
      # Le secret APP_STORE_API_KEY est le JSON fastlane (key_id, issuer_id, key) en base64.
      - name: Configure App Store Connect API key for EAS
        env:
          APP_STORE_API_KEY: ${{ secrets.APP_STORE_API_KEY }}
        run: |
          cd front
          echo "$APP_STORE_API_KEY" | base64 -d > asc-api-key.json
          node -e "
            const k = require('./asc-api-key.json');
            if (!k.key_id || !k.issuer_id || !k.key) throw new Error('APP_STORE_API_KEY: champs key_id / issuer_id / key attendus');
            require('fs').writeFileSync('asc-api-key.p8', k.key);
            console.log('EXPO_ASC_KEY_ID=' + k.key_id);
            console.log('EXPO_ASC_ISSUER_ID=' + k.issuer_id);
          " >> "$GITHUB_ENV"
          echo "EXPO_ASC_API_KEY_PATH=$PWD/asc-api-key.p8" >> "$GITHUB_ENV"
          rm asc-api-key.json

      - name: Yarn
        env:
          YARN_IGNORE_NODE: "1"
        run: |
          cd front
          yarn install
          yarn build-prod:ios --json > build-ios.json

      # Le binaire est téléchargé depuis EAS puis publié en artefact GitHub,
      # pour pouvoir le récupérer sans accès au compte Expo.
      - name: Download build from EAS
        run: |
          cd front
          BUILD_URL=$(node -e "const t = require('fs').readFileSync('build-ios.json', 'utf8'); const b = JSON.parse(t.slice(t.indexOf('['))); console.log(b[0].artifacts.buildUrl)")
          curl -sSL -o 1000jours-ios.ipa "$BUILD_URL"
          ls -l 1000jours-ios.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: 1000jours-ios
          path: front/1000jours-ios.ipa
          retention-days: 30

  Build-android:
    name: Build and publish Android for Prod
    if: ${{ inputs.platform == 'all' || inputs.platform == 'android' || inputs.platform == '' }}
    runs-on: ubuntu-latest
    env:
      API_URL: https://backoffice-les1000jours.fabrique.social.gouv.fr
      CLEAR_STORAGE: false
      MATOMO_APPLICATION_ID: 43
      MATOMO_ENABLED: true
      MATOMO_URL: https://matomo.fabrique.social.gouv.fr/
      SENTRY_DSN: https://5dbac413000f4a43a073841acebc82f5@sentry.fabrique.social.gouv.fr/55
      SENTRY_ENABLED: true
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      DEEPLINK_DOMAIN: 1000jours.fabrique.social.gouv.fr
      DEEPLINK_PATH: app-millejours
      NODE_OPTIONS: --max_old_space_size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # eas-cli >= 24 (et ses dépendances) exige Node 22
          node-version: 22.x

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Yarn
        env:
          YARN_IGNORE_NODE: "1"
        run: |
          cd front
          yarn install
          yarn build-prod:android --json > build-android.json

      # Le binaire est téléchargé depuis EAS puis publié en artefact GitHub,
      # pour pouvoir le récupérer sans accès au compte Expo.
      - name: Download build from EAS
        run: |
          cd front
          BUILD_URL=$(node -e "const t = require('fs').readFileSync('build-android.json', 'utf8'); const b = JSON.parse(t.slice(t.indexOf('['))); console.log(b[0].artifacts.buildUrl)")
          curl -sSL -o 1000jours-android.aab "$BUILD_URL"
          ls -l 1000jours-android.aab

      - uses: actions/upload-artifact@v4
        with:
          name: 1000jours-android
          path: front/1000jours-android.aab
          retention-days: 30
